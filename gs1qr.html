<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS1総合（1D/2D）リアルタイムパーススキャナー</title>
    <!-- ZXingライブラリの読み込み -->
    <script type="text/javascript" src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; color: #333; text-align: center; }
        h1 { font-size: 1.2rem; margin-bottom: 10px; }
        .video-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: auto; display: block; }
        .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; border: 40px solid rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .scan-guide { width: 85%; height: 60%; border: 3px solid #00ff66; border-radius: 4px; box-shadow: 0 0 15px #00ff66; position: relative; }
        .control-panel { margin-top: 15px; }
        button { background: #007aff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        button:active { background: #0051a8; }
        .result-box { background: white; max-width: 500px; margin: 20px auto 0; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; }
        .result-title { font-weight: bold; color: #007aff; margin-bottom: 5px; }
        .result-content { background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; word-break: break-all; font-size: 0.95rem; border: 1px solid #ddd; }
        .ai-item { border-left: 4px solid #34c759; background: #f2fbf4; padding: 6px 10px; margin: 5px 0; border-radius: 0 4px 4px 0; font-size: 0.9rem; }
        .ai-num { font-weight: bold; color: #1c7430; margin-right: 8px; }
    </style>
</head>
<body>

    <h1>GS1 (128 / QR) リアルタイムスキャナー</h1>

    <div class="video-container">
        <video id="video"></video>
        <div class="scan-overlay"><div class="scan-guide"></div></div>
    </div>

    <div class="control-panel">
        <button id="start-btn">スキャン開始</button>
    </div>

    <div class="result-box">
        <div class="result-title">【判定結果】<span id="format" style="font-size:0.8rem; color:#666; margin-left:10px;"></span></div>
        <div id="raw-data" style="font-size:0.8rem; color:#888; margin-bottom:8px; word-break:break-all;"></div>
        
        <div class="result-title" style="margin-top:10px;">【GS1項目データ分解】</div>
        <div id="parsed-data">コドをかざすとここに分解表示されます。</div>
    </div>

    <script>
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const videoElement = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const formatElement = document.getElementById('format');
        const rawDataElement = document.getElementById('raw-data');
        const parsedDataElement = document.getElementById('parsed-data');
        let isScanning = false;

        startBtn.addEventListener('click', () => {
            if (isScanning) {
                codeReader.reset();
                videoElement.srcObject = null;
                startBtn.textContent = "スキャン開始";
                startBtn.style.background = "#007aff";
                isScanning = false;
            } else {
                rawDataElement.textContent = "";
                parsedDataElement.innerHTML = "読み取り中...";
                
                codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                    if (result) {
                        let text = result.text;
                        let format = result.format;
                        let typeLabel = "通常のコード";

                        // --- ① 開始隠し文字（AIM識別子）の検知とクリーニング ---
                        // GS1-QRの場合、先頭に「]Q3」という隠し文字が自動付与されます
                        if (text.startsWith(']Q3')) {
                            typeLabel = "GS1-QRコード";
                            text = text.substring(3); // 「]Q3」を除去
                        } 
                        // GS1-128（Code128）の場合、先頭に「]C1」が入る場合があります
                        else if (format === 'CODE_128' || format === 3) {
                            typeLabel = "GS1-128バーコード";
                            if (text.startsWith(']C1')) {
                                text = text.substring(3); // 「]C1」を除去
                            }
                        } else if (format === 'QR_CODE') {
                            typeLabel = "通常のQRコード";
                        }

                        formatElement.textContent = `${typeLabel} (${format})`;
                        rawDataElement.textContent = `クレンジング後生データ: ${text.replace(/\x1d/g, '<GS>')}`;

                        // --- ② GS1データの分解（簡易パース処理） ---
                        parseGS1Elements(text);

                        if (navigator.vibrate) navigator.vibrate(100);
                    }
                }).then(() => {
                    startBtn.textContent = "ストップ";
                    startBtn.style.background = "#ff3b30";
                    isScanning = true;
                }).catch(err => alert("カメラ起動エラー: " + err));
            }
        });

        // 定番の主要なアプリケーション識別子（AI）の定義リスト（固定長か可変長かを識別するため）
        // ※業務に合わせて必要なAI（01, 10, 17, 21など）を追加・変更してください。
        const GS1_AI_RULES = [
            { ai: "01", length: 14, label: "商品コード(GTIN)" },
            { ai: "10", length: null, label: "ロット番号" }, // 可変長（最大20桁、後ろに<GS>が来る）
            { ai: "11", length: 6,  label: "製造日(YYMMDD)" },
            { ai: "17", length: 6,  label: "有効期限(YYMMDD)" },
            { ai: "21", length: null, label: "シリアル番号" }, // 可変長
            { ai: "30", length: null, label: "数量・個数" }    // 可変長
        ];

        function parseGS1Elements(gs1Text) {
            let currentStr = gs1Text;
            let htmlResult = "";
            let matchFound = true;

            // 文字列が空になるか、解析できなくなるまでループ
            while (currentStr.length > 0 && matchFound) {
                matchFound = false;

                for (let rule of GS1_AI_RULES) {
                    if (currentStr.startsWith(rule.ai)) {
                        matchFound = true;
                        let ai = rule.ai;
                        let value = "";
                        
                        // 残りの文字列からAIコード分を削る
                        currentStr = currentStr.substring(ai.length);

                        if (rule.length !== null) {
                            // 固定長の場合：決められた桁数を抜き出す
                            value = currentStr.substring(0, rule.length);
                            currentStr = currentStr.substring(rule.length);
                        } else {
                            // 可変長の場合：区切り文字「\x1d」(GS) があるところまで抜き出す
                            let gsIndex = currentStr.indexOf('\x1d');
                            if (gsIndex !== -1) {
                                value = currentStr.substring(0, gsIndex);
                                currentStr = currentStr.substring(gsIndex + 1); // <GS>の1文字分を飛ばす
                            } else {
                                // 後続に区切りがない場合は、文字列の最後までが値
                                value = currentStr;
                                currentStr = "";
                            }
                        }

                        htmlResult += `
                            <div class="ai-item">
                                <span class="ai-num">(${ai}) ${rule.label}:</span>
                                <span>${value}</span>
                            </div>
                        `;
                        break;
                    }
                }

                // 定義されていないAIに遭遇した場合のセーフティガード
                if (!matchFound) {
                    htmlResult += `<div class="ai-item" style="border-left-color:#ff3b30; background:#fff2f2;">
                        <span class="ai-num" style="color:#ff3b30;">未定義データ:</span>
                        <span>${currentStr}</span>
                    </div>`;
                    break;
                }
            }

            parsedDataElement.innerHTML = htmlResult || "GS1標準に準拠したデータが検出されませんでした。";
        }
    </script>
</body>
</html>
